<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Генетична симуляція (9 клас)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <h1>Генетична симуляція</h1>
  <p>
    Оберіть фенотипи батьків і дослідіть, як ознаки передаються нащадкам.
  </p>

  <!-- ================= ТИП СХРЕЩУВАННЯ ================= -->
  <div class="panel">
    <div class="panel-title">Тип схрещування</div>
    <label>
      <input type="radio" name="model" value="mono" checked>
      Моногібридне (1 ознака)
    </label>
    <label style="margin-left:20px;">
      <input type="radio" name="model" value="di">
      Дигібридне (2 ознаки)
    </label>
  </div>

  <!-- ================= ОЗНАКА 1 ================= -->
  <div class="panel">
    <div class="panel-title">Ознака 1 — колір насіння</div>

    <div class="form-row">
      <strong>Батько 1:</strong>

      <label class="phenotype">
        <input type="radio" name="p1-g1" value="AA">
        <span class="seed yellow"></span>
        Жовте (AA)
      </label>

      <label class="phenotype">
        <input type="radio" name="p1-g1" value="Aa">
        <span class="seed hetero"></span>
        Проміжне (Aa)
      </label>

      <label class="phenotype">
        <input type="radio" name="p1-g1" value="aa">
        <span class="seed green"></span>
        Зелене (aa)
      </label>
    </div>

    <div class="form-row">
      <strong>Батько 2:</strong>

      <label class="phenotype">
        <input type="radio" name="p2-g1" value="AA">
        <span class="seed yellow"></span>
        Жовте (AA)
      </label>

      <label class="phenotype">
        <input type="radio" name="p2-g1" value="Aa">
        <span class="seed hetero"></span>
        Проміжне (Aa)
      </label>

      <label class="phenotype">
        <input type="radio" name="p2-g1" value="aa">
        <span class="seed green"></span>
        Зелене (aa)
      </label>
    </div>
  </div>

  <!-- ================= ОЗНАКА 2 ================= -->
  <div class="panel" id="trait2" style="display:none;">
    <div class="panel-title">Ознака 2 — форма насіння</div>

    <div class="form-row">
      <strong>Батько 1:</strong>

      <label class="phenotype">
        <input type="radio" name="p1-g2" value="BB">
        <span class="shape round"></span>
        Гладке (BB)
      </label>

      <label class="phenotype">
        <input type="radio" name="p1-g2" value="Bb">
        <span class="shape hetero-shape"></span>
        Проміжна форма (Bb)
      </label>

      <label class="phenotype">
        <input type="radio" name="p1-g2" value="bb">
        <span class="shape wrinkled"></span>
        Зморшкувате (bb)
      </label>
    </div>

    <div class="form-row">
      <strong>Батько 2:</strong>

      <label class="phenotype">
        <input type="radio" name="p2-g2" value="BB">
        <span class="shape round"></span>
        Гладке (BB)
      </label>

      <label class="phenotype">
        <input type="radio" name="p2-g2" value="Bb">
        <span class="shape hetero-shape"></span>
        Проміжна форма (Bb)
      </label>

      <label class="phenotype">
        <input type="radio" name="p2-g2" value="bb">
        <span class="shape wrinkled"></span>
        Зморшкувате (bb)
      </label>
    </div>
  </div>

  <!-- ================= ПАРАМЕТРИ ================= -->
  <div class="panel">
    <label>Кількість нащадків:</label>
    <input id="offspring" type="number" min="20" value="200">
    <br><br>
    <button id="run">Запустити схрещування</button>
  </div>

  <!-- ================= РЕЗУЛЬТАТИ ================= -->
  <div id="output"></div>

</div>

<script type="module" src="app.js"></script>
</body>
</html>
